<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absensi - Guru</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="teachers">
    <div class="container">
      <header class="topbar">
        <div>
          <p class="eyebrow">Sypesantren Jagat Ar</p>
          <h1>Manajemen Guru</h1>
        </div>
        <nav class="topnav" aria-label="Navigasi utama">
          <a href="/">Dashboard</a>
          <a href="/attendance">Attendance</a>
          <a href="/students">Students</a>
          <a href="/teachers" class="active">Teachers</a>
          <a href="/reports">Reports</a>
          <a href="/kiosk">Kiosk</a>
        </nav>
        <div class="header-date" id="currentDate"></div>
      </header>

      <main class="content-grid">
        <section class="card">
          <h2>Tambah Guru</h2>
          <form id="teacherForm" class="mini-form">
            <label>
              <span>ID</span>
              <input type="text" id="teacherId" placeholder="G-200" required />
            </label>
            <label>
              <span>Nama</span>
              <input type="text" id="teacherName" placeholder="Nama guru" required />
            </label>
            <label>
              <span>Mata Pelajaran</span>
              <input type="text" id="teacherSubject" placeholder="IPA" required />
            </label>
            <button type="submit">Tambah Guru</button>
          </form>
        </section>

        <section class="card">
          <h2>Data Guru</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Mata Pelajaran</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="teachersTable"></tbody>
          </table>
        </section>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
