<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absensi Sypesantren Jagat Ar</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="dashboard">
    <div class="container">
      <header class="topbar">
        <div>
          <p class="eyebrow">Sypesantren Jagat Ar</p>
          <h1>Dashboard Absensi</h1>
        </div>
        <nav class="topnav" aria-label="Navigasi utama">
          <a href="/" class="active">Dashboard</a>
          <a href="/attendance">Attendance</a>
          <a href="/students">Students</a>
          <a href="/teachers">Teachers</a>
          <a href="/reports">Reports</a>
          <a href="/kiosk">Kiosk</a>
        </nav>
        <div class="header-date" id="currentDate"></div>
      </header>

      <section class="stats" id="statsCards"></section>

      <main class="content-grid">
        <section class="card form-card">
          <h2>Catat Kehadiran</h2>
          <form id="attendanceForm">
            <div class="field-row">
              <label>
                <span>Role</span>
                <select id="role" name="role">
                  <option value="student">Siswa</option>
                  <option value="teacher">Guru</option>
                </select>
              </label>
              <label>
                <span>Status</span>
                <select id="status" name="status">
                  <option value="present">Hadir</option>
                  <option value="late">Terlambat</option>
                  <option value="absent">Tidak Hadir</option>
                </select>
              </label>
            </div>

            <label>
              <span>Nama</span>
              <input id="personName" name="name" type="text" placeholder="Masukkan nama" required />
            </label>

            <label>
              <span>ID</span>
              <input id="personId" name="personId" type="text" placeholder="Contoh: S-101 atau G-201" required />
            </label>

            <button type="submit">Simpan Kehadiran</button>
          </form>
        </section>

        <section class="card list-card">
          <h2>Daftar Kehadiran Hari Ini</h2>
          <div id="attendanceList" class="rows"></div>
        </section>
      </main>

      <section class="secondary-grid">
        <div class="card admin-card">
          <h2>Login Admin</h2>
          <form id="adminLoginForm" class="login-form">
            <label>
              <span>Username</span>
              <input id="adminUsername" type="text" value="admin" required />
            </label>
            <label>
              <span>Password</span>
              <input id="adminPassword" type="password" value="admin123" required />
            </label>
            <button type="submit">Masuk</button>
          </form>
          <p id="adminStatus" class="status-text">Gunakan akun default admin</p>
        </div>

        <div class="card report-card">
          <h2>Ringkasan Harian</h2>
          <div class="filter-row">
            <label>
              <span>Tanggal</span>
              <input id="reportDate" type="date" />
            </label>
            <label>
              <span>Kelas</span>
              <select id="classFilter">
                <option value="all">Semua</option>
              </select>
            </label>
          </div>
          <button id="exportCsvBtn" class="secondary-btn" type="button">Export CSV</button>
          <div id="reportSummary" class="report-summary"></div>
        </div>

        <div class="card report-card">
          <h2>Ringkasan Bulanan</h2>
          <div class="filter-row">
            <label>
              <span>Bulan</span>
              <input id="monthlyMonth" type="month" />
            </label>
            <label>
              <span>Kelas</span>
              <select id="monthlyClassFilter">
                <option value="all">Semua</option>
              </select>
            </label>
          </div>
          <button id="exportMonthlyCsvBtn" class="secondary-btn" type="button">Export CSV Bulanan</button>
          <div id="monthlySummary" class="report-summary"></div>
        </div>
      </section>

      <section class="bottom-grid">
        <div class="card">
          <h2>Data Kelas</h2>
          <div id="classesList" class="classes-list"></div>
        </div>

        <div class="card">
          <h2>Data Siswa</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="studentsTable"></tbody>
          </table>
        </div>

        <div class="card">
          <h2>Data Guru</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Mata Pelajaran</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="teachersTable"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
