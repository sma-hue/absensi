<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiosk Absensi</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: #1f2937;
        --primary: #38bdf8;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
        --text: #e5eefb;
        --muted: #93a7c9;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0b1120, #111827);
        color: var(--text);
        min-height: 100vh;
      }

      .screen {
        max-width: 1200px;
        margin: 0 auto;
        padding: 30px 24px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      .brand {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .clock {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 10px 18px;
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 24px;
      }

      .panel {
        background: rgba(17, 24, 39, 0.96);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 22px;
        padding: 24px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
      }

      .status { text-align: center; }

      .status-badge {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        color: var(--primary);
        border: 1px solid rgba(56, 189, 248, 0.3);
        font-weight: 700;
        margin-bottom: 16px;
      }

      h1 {
        font-size: clamp(2.2rem, 5vw, 4rem);
        margin: 0 0 14px;
      }

      .subtitle {
        font-size: 1.25rem;
        color: var(--muted);
        margin: 0;
      }

      .scan-box {
        margin-top: 24px;
        min-height: 180px;
        border-radius: 18px;
        border: 2px dashed rgba(148, 163, 184, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        background: rgba(15, 23, 42, 0.5);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .stat-card {
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 16px;
        padding: 16px;
      }

      .stat-label {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .stat-value {
        margin-top: 10px;
        font-size: 2rem;
        font-weight: 700;
      }

      .result {
        margin-top: 24px;
        padding: 18px 20px;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid rgba(148, 163, 184, 0.15);
      }

      .result.success {
        border-color: rgba(34, 197, 94, 0.5);
        background: rgba(34, 197, 94, 0.08);
      }

      .result.error {
        border-color: rgba(239, 68, 68, 0.5);
        background: rgba(239, 68, 68, 0.08);
      }

      .result strong {
        display: block;
        font-size: 1.2rem;
        margin-bottom: 6px;
      }

      .result small {
        color: var(--muted);
      }

      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <header class="topbar">
        <div class="brand">Sypesantren Jagat Ar</div>
        <div class="clock" id="clock">--:--:--</div>
      </header>

      <div class="grid">
        <section class="panel status">
          <div class="status-badge">Kiosk Absensi</div>
          <h1 id="message">Silakan tap NFC atau hadap kamera</h1>
          <p class="subtitle">Sistem absensi otomatis siswa & guru</p>

          <div class="scan-box">
            <div>
              <strong>Ready</strong><br />
              <small>Menunggu pemindaian...</small>
            </div>
          </div>

          <div id="result" class="result">
            <strong>Belum ada scan</strong>
            <small>Hasil kehadiran akan muncul di sini.</small>
          </div>
        </section>

        <aside class="panel">
          <h2>Ringkasan Hari Ini</h2>
          <div class="stats">
            <div class="stat-card">
              <div class="stat-label">Total</div>
              <div class="stat-value" id="totalToday">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Terakhir</div>
              <div class="stat-value" id="lastScan">-</div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = new Intl.DateTimeFormat('id-ID', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        }).format(now);
      }

      function renderResult(title, text, kind = 'info') {
        const result = document.getElementById('result');
        result.className = `result ${kind}`;
        result.innerHTML = `
          <strong>${title}</strong>
          <small>${text}</small>
        `;
      }

      async function loadSummary() {
        try {
          const response = await fetch('/api/kiosk/summary');
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || 'Gagal memuat ringkasan');

          document.getElementById('totalToday').textContent = data.totalToday ?? 0;
          document.getElementById('lastScan').textContent = data.lastScan ? data.lastScan.name : '-';
          document.getElementById('message').textContent = data.message || 'Silakan tap NFC atau hadap kamera';

          if (data.lastScan) {
            renderResult('Berhasil', `${data.lastScan.name} hadir pada ${data.lastScan.time}`, 'success');
          } else {
            renderResult('Belum ada scan', 'Hasil kehadiran akan muncul di sini.', '');
          }
        } catch (error) {
          document.getElementById('message').textContent = 'Koneksi terputus';
          renderResult('Koneksi error', 'Tidak dapat memuat ringkasan absensi saat ini.', 'error');
        }
      }

      socket.on('attendance:update', (payload) => {
        const scan = payload.record || payload;
        const name = scan && scan.name ? scan.name : 'Peserta';
        const time = scan && scan.time ? scan.time : new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        const status = scan && scan.status ? scan.status : 'present';
        const label = status === 'present' ? 'Hadir' : status === 'late' ? 'Terlambat' : 'Tidak Hadir';

        document.getElementById('message').textContent = `${name} berhasil tercatat`;
        renderResult('Absensi masuk', `${name} (${label}) • ${time}`, 'success');
        loadSummary();
      });

      socket.on('system:ready', () => {
        document.getElementById('message').textContent = 'Silakan tap NFC atau hadap kamera';
      });

      async function pollSummary() {
        await loadSummary();
        setInterval(loadSummary, 5000);
      }

      updateClock();
      setInterval(updateClock, 1000);
      pollSummary();
    </script>
  </body>
</html>
