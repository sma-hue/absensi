<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk Absensi - Tap NFC atau Hadap Kamera</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .kiosk-container {
      width: 100%;
      max-width: 1000px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 600px;
    }

    /* Left side: Camera & Instructions */
    .camera-section {
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      position: relative;
    }

    #videoContainer {
      width: 100%;
      max-width: 350px;
      border-radius: 15px;
      overflow: hidden;
      background: #222;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #video {
      width: 100%;
      height: auto;
      display: block;
      transform: scaleX(-1);
    }

    .camera-status {
      color: #888;
      font-size: 14px;
      margin-top: 20px;
      text-align: center;
    }

    .camera-status.ready {
      color: #4caf50;
    }

    .camera-status.error {
      color: #f44336;
    }

    /* Right side: Display & Info */
    .info-section {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
    }

    .header-time {
      text-align: center;
      margin-bottom: 30px;
    }

    .time-display {
      font-size: 48px;
      font-weight: bold;
      color: #667eea;
      line-height: 1;
    }

    .date-display {
      font-size: 18px;
      color: #666;
      margin-top: 10px;
    }

    /* Idle State */
    .idle-state {
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .idle-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .idle-instruction {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }

    .idle-subtitle {
      font-size: 16px;
      color: #666;
    }

    /* Success State */
    .success-state {
      text-align: center;
      flex-grow: 1;
      display: none;
      flex-direction: column;
      justify-content: center;
      animation: slideIn 0.5s ease-out;
    }

    .success-state.active {
      display: flex;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .success-icon {
      font-size: 60px;
      color: #4caf50;
      margin-bottom: 20px;
      animation: scaleIn 0.4s ease-out;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }

    .student-photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 20px;
      border: 4px solid #4caf50;
      box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
    }

    .student-info {
      margin-bottom: 20px;
    }

    .student-name {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }

    .student-class {
      font-size: 18px;
      color: #666;
      margin-bottom: 10px;
    }

    .attendance-time {
      font-size: 16px;
      color: #4caf50;
      font-weight: 600;
    }

    /* Error State */
    .error-state {
      text-align: center;
      flex-grow: 1;
      display: none;
      flex-direction: column;
      justify-content: center;
      animation: slideIn 0.5s ease-out;
    }

    .error-state.active {
      display: flex;
    }

    .error-icon {
      font-size: 60px;
      color: #f44336;
      margin-bottom: 20px;
      animation: shake 0.4s ease-out;
    }

    @keyframes shake {
      0%, 100% {
        transform: translateX(0);
      }
      25% {
        transform: translateX(-10px);
      }
      75% {
        transform: translateX(10px);
      }
    }

    .error-message {
      font-size: 20px;
      font-weight: bold;
      color: #f44336;
      margin-bottom: 10px;
    }

    .error-detail {
      font-size: 14px;
      color: #666;
    }

    /* Status Bar */
    .status-bar {
      background: #333;
      color: #fff;
      padding: 10px;
      text-align: center;
      font-size: 12px;
    }

    .status-bar.online {
      background: #4caf50;
    }

    .status-bar.offline {
      background: #f44336;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .kiosk-container {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .camera-section {
        padding: 20px;
      }

      .info-section {
        padding: 30px;
      }

      .time-display {
        font-size: 36px;
      }

      .idle-instruction {
        font-size: 20px;
      }
    }
  </style>
</head>
<body data-page="kiosk">
  <div class="kiosk-container">
    <!-- Left: Camera -->
    <div class="camera-section">
      <div id="videoContainer" style="display: none;">
        <video id="video" autoplay playsinline></video>
      </div>
      <canvas id="canvas" style="display: none;"></canvas>
      <div class="camera-status">
        <span id="cameraStatus">📹 Kamera sedang diinisialisasi...</span>
      </div>
    </div>

    <!-- Right: Display & Info -->
    <div class="info-section">
      <!-- Header Time -->
      <div class="header-time">
        <div class="time-display" id="timeDisplay">00:00:00</div>
        <div class="date-display" id="dateDisplay">Memuat...</div>
      </div>

      <!-- Idle State -->
      <div class="idle-state" id="idleState">
        <div class="idle-icon">📱</div>
        <div class="idle-instruction">Tap Kartu NFC</div>
        <div class="idle-subtitle">atau Hadap Kamera untuk Scan Wajah</div>
      </div>

      <!-- Success State -->
      <div class="success-state" id="successState">
        <div class="success-icon">✓</div>
        <img id="studentPhoto" class="student-photo" src="" alt="Foto Siswa">
        <div class="student-info">
          <div class="student-name" id="studentName">-</div>
          <div class="student-class" id="studentClass">-</div>
          <div class="attendance-time" id="attendanceTime">-</div>
        </div>
      </div>

      <!-- Error State -->
      <div class="error-state" id="errorState">
        <div class="error-icon">✗</div>
        <div class="error-message" id="errorMessage">Scan Gagal</div>
        <div class="error-detail" id="errorDetail">Silakan coba lagi</div>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar" id="statusBar">
    🔴 Offline - Menghubungkan ke server...
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let isProcessing = false;
    let lastScanTime = 0;
    const SCAN_COOLDOWN = 60000; // 1 minute

    // ===== Time Display =====
    function updateTime() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      const dateStr = now.toLocaleDateString('id-ID', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      document.getElementById('timeDisplay').textContent = timeStr;
      document.getElementById('dateDisplay').textContent = dateStr;
    }

    setInterval(updateTime, 1000);
    updateTime();

    // ===== Socket.IO Connection =====
    socket.on('connect', () => {
      console.log('✅ Connected to server');
      updateStatusBar(true);
    });

    socket.on('disconnect', () => {
      console.log('❌ Disconnected from server');
      updateStatusBar(false);
    });

    function updateStatusBar(isOnline) {
      const bar = document.getElementById('statusBar');
      if (isOnline) {
        bar.className = 'status-bar online';
        bar.textContent = '🟢 Online - Siap Scan';
      } else {
        bar.className = 'status-bar offline';
        bar.textContent = '🔴 Offline - Koneksi terputus';
      }
    }

    // ===== NFC Reader (Web Serial API) =====
    async function setupNFCReader() {
      try {
        const ports = await navigator.serial.getPorts();
        if (ports.length === 0) {
          console.log('⚠️ NFC reader tidak ditemukan. Silakan connect USB reader.');
          return;
        }

        const port = ports[0]; // Ambil port pertama
        console.log('🔍 NFC Reader ditemukan:', port);

        await port.open({ baudRate: 9600 });
        listenNFC(port);
      } catch (error) {
        console.error('❌ Gagal setup NFC reader:', error);
        alert('Gagal menghubungkan NFC Reader. Silakan connect USB reader dan refresh halaman.');
      }
    }

    async function listenNFC(port) {
      const reader = port.readable.getReader();
      let buffer = '';

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += new TextDecoder().decode(value);

          // Split by newline untuk multiple UID
          const lines = buffer.split('\n');
          buffer = lines.pop(); // Keep last incomplete line

          for (const line of lines) {
            const uid = line.trim();
            if (uid.length > 0) {
              console.log('📱 NFC UID dibaca:', uid);
              await processNFCScan(uid);
            }
          }
        }
      } catch (error) {
        console.error('❌ NFC Reader error:', error);
      } finally {
        reader.releaseLock();
      }
    }

    // Fallback: Manual NFC input untuk testing
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && window.nfcInputMode) {
        const uid = window.nfcBuffer.trim();
        if (uid.length > 0) {
          processNFCScan(uid);
          window.nfcBuffer = '';
        }
      } else if (window.nfcInputMode && e.key !== 'Escape') {
        window.nfcBuffer += e.key;
      }
    });

    window.nfcInputMode = true;
    window.nfcBuffer = '';

    async function processNFCScan(uid) {
      if (isProcessing) return;
      if (Date.now() - lastScanTime < SCAN_COOLDOWN) {
        console.log('⏳ Cooldown: Cegah duplicate scan');
        return;
      }

      isProcessing = true;
      lastScanTime = Date.now();

      try {
        const response = await fetch('/api/attendance/scan-nfc', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nfcUid: uid })
        });

        const result = await response.json();

        if (result.success) {
          showSuccessState(result.data);
        } else {
          showErrorState(result.message || 'UID tidak terdaftar');
        }
      } catch (error) {
        console.error('❌ Error:', error);
        showErrorState('Gagal menghubungi server');
      } finally {
        isProcessing = false;
      }
    }

    // ===== Webcam Initialization =====
    async function initWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 350, height: 350 },
          audio: false
        });

        const video = document.getElementById('video');
        const container = document.getElementById('videoContainer');

        video.srcObject = stream;
        container.style.display = 'block';

        document.getElementById('cameraStatus').textContent = '📹 Kamera siap - Face Recognition aktif';
        document.getElementById('cameraStatus').className = 'camera-status ready';

        // Start face detection interval
        startFaceDetection(video);
      } catch (error) {
        console.error('❌ Kamera error:', error);
        document.getElementById('cameraStatus').textContent = '❌ Kamera tidak tersedia';
        document.getElementById('cameraStatus').className = 'camera-status error';
      }
    }

    let faceDetectionInterval = null;

    function startFaceDetection(video) {
      faceDetectionInterval = setInterval(async () => {
        if (isProcessing || Date.now() - lastScanTime < SCAN_COOLDOWN) {
          return;
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        ctx.drawImage(video, 0, 0);
        const imageData = canvas.toDataURL('image/jpeg', 0.8);

        // Send to backend for face recognition
        await processFaceScan(imageData);
      }, 2000); // Scan setiap 2 detik
    }

    async function processFaceScan(imageData) {
      if (isProcessing) return;

      isProcessing = true;

      try {
        const response = await fetch('/api/attendance/scan-face', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ faceImage: imageData })
        });

        const result = await response.json();

        if (result.success && result.data.confidence > 0.6) {
          // Confidence > 60%
          lastScanTime = Date.now(); // Update cooldown
          showSuccessState(result.data);
        }
      } catch (error) {
        console.error('Face recognition error:', error);
      } finally {
        isProcessing = false;
      }
    }

    // ===== UI State Management =====
    function showSuccessState(data) {
      document.getElementById('idleState').style.display = 'none';
      document.getElementById('errorState').classList.remove('active');
      document.getElementById('successState').classList.add('active');

      // Populate data
      document.getElementById('studentPhoto').src = data.photoUrl || '/default-photo.png';
      document.getElementById('studentName').textContent = data.personName;
      document.getElementById('studentClass').textContent =
        data.className || (data.subject || 'Guru');

      const now = new Date();
      const timeStr = now.toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('attendanceTime').textContent = `Masuk: ${timeStr}`;

      // Play success sound
      playSound('success');

      // Auto-reset after 3 seconds
      setTimeout(() => {
        resetDisplay();
      }, 3000);
    }

    function showErrorState(message) {
      document.getElementById('idleState').style.display = 'none';
      document.getElementById('successState').classList.remove('active');
      document.getElementById('errorState').classList.add('active');

      document.getElementById('errorMessage').textContent = 'Scan Gagal';
      document.getElementById('errorDetail').textContent = message;

      // Play error sound
      playSound('error');

      // Auto-reset after 2 seconds
      setTimeout(() => {
        resetDisplay();
      }, 2000);
    }

    function resetDisplay() {
      document.getElementById('successState').classList.remove('active');
      document.getElementById('errorState').classList.remove('active');
      document.getElementById('idleState').style.display = 'flex';
    }

    function playSound(type) {
      // Create simple beep using Web Audio API
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      if (type === 'success') {
        oscillator.frequency.value = 800;
        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.3);
      } else if (type === 'error') {
        oscillator.frequency.value = 400;
        gain.gain.setValueAtTime(0.2, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.5);
      }
    }

    // ===== Initialize on Page Load =====
    document.addEventListener('DOMContentLoaded', () => {
      initWebcam();
      setupNFCReader();
    });

    // WebSocket listener untuk attendance result
    socket.on('attendance:result', (data) => {
      if (data.success) {
        showSuccessState(data.person);
      } else {
        showErrorState(data.message);
      }
    });
  </script>
</body>
</html>
